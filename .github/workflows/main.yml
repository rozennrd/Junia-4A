name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

# Définition des secrets nécessaires dans les paramètres GitHub :
# DOCKER_USERNAME : votre nom d'utilisateur Docker Hub
# DOCKER_PASSWORD : votre token d'accès Docker Hub
# SSH_PRIVATE_KEY : votre clé SSH privée
# SSH_HOST : l'adresse IP de votre machine
# SSH_USER : votre nom d'utilisateur SSH

jobs:
  lint:
    name: PHP Lint
    runs-on: self-hosted  # Utilisation de votre runner self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Lint PHP files
        run: |
          for file in $(find . -name "*.php"); do
            php -l "$file" || exit 1
          done

  build:
    name: Build Docker Image
    needs: lint  # S'exécute après le lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3
      
      - name: Build image
        run: |
          docker build -t my-php-app:${{ github.sha }} .
          # On sauvegarde temporairement l'image pour le job suivant
          docker save my-php-app:${{ github.sha }} > /tmp/my-php-app.tar

  push:
    name: Push to Local Registry
    needs: build
    runs-on: self-hosted
    steps:
      - name: Load saved image
        run: docker load < /tmp/my-php-app.tar
      
      - name: Tag and push to local registry
        run: |
          docker tag my-php-app:${{ github.sha }} localhost:5000/my-php-app:latest
          docker push localhost:5000/my-php-app:latest

  push-dockerhub:
    name: Push to Docker Hub
    needs: build
    runs-on: self-hosted
    steps:
      - name: Load saved image
        run: docker load < /tmp/my-php-app.tar
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        run: |
          docker tag my-php-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my-php-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-php-app:latest

  deploy:
    name: Deploy
    needs: [push, push-dockerhub]
    runs-on: self-hosted
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull localhost:5000/my-php-app:latest
            docker-compose down
            docker-compose up -d
